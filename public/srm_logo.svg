<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F2459" />
    </linearGradient>
  </defs>

  <!-- Crest Emblem (Left) -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle -->
    <circle cx="50" cy="50" r="48" fill="url(#blueGrad)" stroke="#F59E0B" stroke-width="3" />
    <circle cx="50" cy="50" r="43" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="3,2" />

    <!-- Rising Sun Rays -->
    <path d="M50 20 L50 27 M32 25 L36 31 M68 25 L64 31 M23 37 L29 40 M77 37 L71 40" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="50" cy="38" r="9" fill="url(#goldGrad)" />

    <!-- Open Book of Knowledge -->
    <path d="M50 48 C43 45 32 44 26 48 L26 68 C32 64 43 65 50 69 C57 65 68 64 74 68 L74 48 C68 44 57 45 50 48 Z" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.5" />
    <line x1="50" y1="48" x2="50" y2="69" stroke="#1E3A8A" stroke-width="1.5" />
    <!-- Book Lines -->
    <line x1="30" y1="53" x2="45" y2="52" stroke="#CBD5E1" stroke-width="1" />
    <line x1="30" y1="58" x2="45" y2="57" stroke="#CBD5E1" stroke-width="1" />
    <line x1="30" y1="63" x2="45" y2="62" stroke="#CBD5E1" stroke-width="1" />
    <line x1="55" y1="52" x2="70" y2="53" stroke="#CBD5E1" stroke-width="1" />
    <line x1="55" y1="57" x2="70" y2="58" stroke="#CBD5E1" stroke-width="1" />
    <line x1="55" y1="62" x2="70" y2="63" stroke="#CBD5E1" stroke-width="1" />

    <!-- Cogwheel / Technology Teeth -->
    <circle cx="50" cy="78" r="8" fill="none" stroke="#F59E0B" stroke-width="3" />
    <path d="M50 67 L50 71 M50 85 L50 89 M40 78 L44 78 M56 78 L60 78 M43 71 L46 74 M54 82 L57 85 M43 85 L46 82 M54 74 L57 71" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" />

    <!-- Bottom Ribbon -->
    <path d="M22 86 C32 83 68 83 78 86 L74 93 C64 90 36 90 26 93 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="0.8" />
    <text x="50" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="800" fill="#1E3A8A" letter-spacing="0.5">LEARN. LEAP. LEAD.</text>
  </g>

  <!-- Typography Wordmark (Right) -->
  <g transform="translate(125, 24)">
    <!-- University Main Name -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="25" font-weight="900" fill="#1E3A8A" letter-spacing="-0.3">
      SRM
    </text>
    <text x="65" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#0F2459" letter-spacing="-0.2">
      INSTITUTE OF SCIENCE &amp; TECHNOLOGY
    </text>
    <!-- Subtitle / Accreditation -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D97706" letter-spacing="0.2">
      (Deemed to be University u/s 3 of UGC Act, 1956)
    </text>
    <text x="0" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#475569">
      Tiruchirappalli Campus · Faculty of Engineering and Technology | Division of Chemistry
    </text>
  </g>
</svg>
